name: Build & deploy

on:
  schedule:
    - cron: "30 4 * * *"   # 06:30 CEST / 05:30 CET
    - cron: "17 5,7,10 * * *"   # backup attempts; skipped after a successful daily deploy
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-refresh:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.status.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4

      - id: status
        name: Check deployed status
        run: python scripts/check_refresh.py

  build:
    needs: check-refresh
    # Missing output or a failed check must refresh; only an explicit fresh result skips it.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.check-refresh.outputs.should_build != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .[dev]

      - name: Test
        run: pytest -q

      - name: Build site
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}   # volitelné: openai | anthropic (jinak podle klíče)
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}   # volitelné, výchozí gpt-6-luna
        run: python -m mostek_kultura build --out site

      - name: Commit cache
        continue-on-error: true   # a failed cache push must not block the deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache
          if git diff --cached --quiet; then echo "cache unchanged"; else
            git commit -m "cache: update $(date -u +%F) [skip ci]"
            git pull --rebase -X theirs origin main
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
